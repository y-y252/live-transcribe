<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>ライブ文字起こし</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",sans-serif;
  background:#f2f2f7;color:#1c1c1e;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid #e3e3e8;flex-wrap:wrap}
h1{font-size:15px;margin:0;flex:1;font-weight:700;white-space:nowrap}
.seg{display:flex;border:1px solid #0a84ff;border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;color:#0a84ff;font-size:13px;padding:6px 10px;font-weight:600}
.seg button.on{background:#0a84ff;color:#fff}
.tgl{display:flex;align-items:center;gap:4px;font-size:12px;color:#3a3a3c;flex:none}
main{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;min-height:0}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;
  box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
.pane .cap{flex:none;font-size:11px;font-weight:700;color:#8e8e93;letter-spacing:.06em;padding:8px 12px 0}
.pane .txt{flex:1;overflow-y:auto;padding:6px 12px 12px;font-size:21px;line-height:1.45;white-space:pre-wrap;word-break:break-word;
  -webkit-user-select:text;user-select:text;-webkit-overflow-scrolling:touch}
#transPane .txt{font-size:19px;color:#3c3c43}
.interim{color:#98989f}
.jump{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;background:#0a84ff;color:#fff;
  font-size:13px;font-weight:700;padding:9px 14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.jump.hid{display:none}
footer{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid #e3e3e8}
#exportBar{display:flex;gap:8px}
#exportBar[hidden]{display:none}
.frow{display:flex;gap:8px;align-items:center}
#status{flex:1;font-size:12px;color:#8e8e93;min-width:0}
button.act{border:0;border-radius:10px;font-size:15px;font-weight:700;padding:12px 14px;flex:none}
button.act.sm{flex:1;font-size:13px;padding:10px 8px;background:#e5e5ea;color:#1c1c1e}
#mainBtn{background:#0a84ff;color:#fff;min-width:110px}
body.rec #mainBtn{background:#ff3b30}
#copyBtn,#clearBtn{background:#e5e5ea;color:#1c1c1e;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b30;margin-right:5px;vertical-align:1px;
  animation:blink 1s infinite;visibility:hidden}
body.rec .dot{visibility:visible}
@keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>ライブ文字起こし <span id="ver" style="font-size:10px;color:#8e8e93;font-weight:400"></span></h1>
  <div class="seg">
    <button id="langJa" class="on" type="button">日本語</button>
    <button id="langEn" type="button">English</button>
  </div>
  <label class="tgl"><input type="checkbox" id="transTgl" checked>翻訳</label>
  <label class="tgl"><input type="checkbox" id="recTgl" checked>録音</label>
  <div class="seg" id="engSeg">
    <button id="engSR" class="on" type="button">標準</button>
    <button id="engWH" type="button">ローカルAI</button>
  </div>
  <div class="seg" id="srcSeg" style="display:none">
    <button id="srcMic" class="on" type="button">マイク</button>
    <button id="srcTab" type="button">タブ音声</button>
  </div>
</header>
<main>
  <div class="pane" id="srcPane">
    <div class="cap">原文</div>
    <div class="txt" id="srcTxt"></div>
    <button class="jump hid" id="srcJump" type="button">↓ 最新へ</button>
  </div>
  <div class="pane" id="transPane">
    <div class="cap">翻訳</div>
    <div class="txt" id="transTxt"></div>
    <button class="jump hid" id="trJump" type="button">↓ 最新へ</button>
  </div>
</main>
<footer>
  <div id="exportBar" hidden>
    <button class="act sm" id="expAudio" type="button">音声 (.m4a)</button>
    <button class="act sm" id="expSrc" type="button">原文 (.vtt)</button>
    <button class="act sm" id="expTr" type="button">翻訳 (.vtt)</button>
    <button class="act sm" id="expDiag" type="button">ログ</button>
  </div>
  <div class="frow">
    <div id="status">「開始」を押してください（初回はマイク許可が出ます）</div>
    <button class="act" id="clearBtn" type="button">消去</button>
    <button class="act" id="copyBtn" type="button">コピー</button>
    <button class="act" id="mainBtn" type="button">開始</button>
  </div>
</footer>
<script>
(function(){
'use strict';
/* v3: 認識エンジンが未確定文を破棄して次の文へ移る挙動（英語で顕著）を検知し、
   破棄される直前のテキストを確定へ格上げして温存する。推測による穴埋めは一切しない。 */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var srcTxt=document.getElementById('srcTxt'), transTxt=document.getElementById('transTxt'),
    mainBtn=document.getElementById('mainBtn'), statusEl=document.getElementById('status'),
    jaBtn=document.getElementById('langJa'), enBtn=document.getElementById('langEn'),
    transTgl=document.getElementById('transTgl'), transPane=document.getElementById('transPane'),
    recTgl=document.getElementById('recTgl'),
    srcPane=document.getElementById('srcPane'), exportBar=document.getElementById('exportBar');

var V='v15';                   // 画面表示用バージョン（キャッシュ確認用）
var everStarted=false;         // 一度でも開始したか（ログボタン表示用）
var diagBuf=[];                // 診断ログ（セッション・エラー・再起動の時系列）
function diag(m){
  var d=new Date();
  diagBuf.push(('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2)+' '+m);
  if(diagBuf.length>400)diagBuf.shift();
}
var localASR={};               // 言語別: オンデバイス認識が使えるか
var lang='ja';                 // 'ja' | 'en'（入力言語）
var running=false, rec=null, restartTimer=null;
var committed='';              // 受理済みの確定テキスト（表示・コピーの本体）
var interim='';                // 表示中の暫定テキスト
var doneLen=0;                 // 現セッションの finals のうちチャンク化済みの長さ
var lastGhost='';              // 直前に救済した文（正規化済み・二重取り込み防止用）
var transDone='', transInterim='';
var tChain=Promise.resolve();  // 翻訳の順序保証キュー
var interimTimer=null, transErrShown=false;
var wl=null;

/* 確定セグメント（タイムスタンプ付き・VTT用） */
var segs=[];                   // {t0,t1,src,tr}
var takeStart=0, prevDur=0;

/* 録音 */
var mediaStream=null, recorder=null, audioChunks=[], audioMime='audio/mp4';

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function joiner(){return lang==='en' ? ' ' : '';}
function fullText(){
  var t=committed;
  if(interim) t+=joiner()+interim;
  return t.trim();
}
function setStatus(t){statusEl.textContent=t;}
function elapsedSec(){return prevDur + (takeStart? (Date.now()-takeStart)/1000 : 0);}
function norm(s){return s.trim().toLowerCase().replace(/\s+/g,' ');}

/* ---- スクロール追従（遡り中は固定・「最新へ」で復帰） ---- */
function makeFollow(el,btn){
  var st={on:true};
  el.addEventListener('scroll',function(){
    var atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
    if(atBottom){ st.on=true; btn.classList.add('hid'); }
    else { st.on=false; btn.classList.remove('hid'); }
  });
  btn.addEventListener('click',function(){
    st.on=true; el.scrollTop=el.scrollHeight; btn.classList.add('hid');
  });
  return st;
}
var fSrc=makeFollow(srcTxt,document.getElementById('srcJump'));
var fTr =makeFollow(transTxt,document.getElementById('trJump'));

function render(){
  srcTxt.innerHTML = esc(committed) +
    (interim ? '<span class="interim">'+esc(joiner()+interim)+'</span>' : '');
  if(fSrc.on) srcTxt.scrollTop = srcTxt.scrollHeight;
  transTxt.innerHTML = esc(transDone) +
    (transInterim ? '<span class="interim"> '+esc(transInterim)+'</span>' : '');
  if(fTr.on) transTxt.scrollTop = transTxt.scrollHeight;
}
function refreshUI(){
  document.body.classList.toggle('rec',running);
  mainBtn.textContent = running ? '停止' : '開始';
  exportBar.hidden = running || (!everStarted && segs.length===0 && audioChunks.length===0);
  recTgl.disabled = running;   // 録音のON/OFFは開始前に切り替える
}

/* ---- 翻訳（Google 翻訳の非公式エンドポイント・キー不要） ---- */
function transEnabled(){return transTgl.checked;}
function translateReq(text,sl){
  var tl=(sl==='ja')?'en':'ja';
  var u='https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+sl+'&tl='+tl+'&q='+encodeURIComponent(text);
  return fetch(u).then(function(r){if(!r.ok)throw new Error('http');return r.json();})
    .then(function(j){return (j[0]||[]).map(function(x){return (x&&x[0])||'';}).join('');});
}

/* 確定テキストを1チャンク受理: 表示へ反映＋VTTセグメント化＋翻訳キュー投入 */
function commitChunk(text){
  var trimmed=text.trim();
  if(!trimmed)return;
  var nx=norm(trimmed);
  if(nx.length>=15){
    var tail=norm(committed).slice(-(nx.length*3+40));
    if(contained(nx,tail)>=0.85)return;   // 直前に同内容を確定済み → 繰り返し防止（最後の保険）
  }
  committed += trimmed + (lang==='en'?' ':'');
  var now=elapsedSec();
  var seg={t0:(segs.length?segs[segs.length-1].t1:0), t1:now, src:trimmed, tr:''};
  segs.push(seg);
  if(transEnabled()){
    var sl=lang;
    transInterim='';
    tChain=tChain.then(function(){
      return translateReq(trimmed,sl).then(function(t){
        seg.tr=t;
        transDone += (transDone && !/\s$/.test(transDone) ? ' ' : '') + t;
        transErrShown=false; render();
      }).catch(function(){
        if(!transErrShown){transErrShown=true;setStatus('翻訳サーバーに接続できません（文字起こしは継続中）');}
      });
    });
  }
}
function scheduleInterimTranslation(){
  if(!transEnabled())return;
  clearTimeout(interimTimer);
  interimTimer=setTimeout(function(){
    var t=interim;
    if(!t.trim()){transInterim='';render();return;}
    translateReq(t,lang).then(function(x){
      if(interim && (interim===t || interim.indexOf(t)===0 || t.indexOf(interim)===0)){
        transInterim=x; render();
      }
    }).catch(function(){});
  },500);
}

/* 認識器が前の文を破棄して新しい文を始めたか（言い直し修正とは区別する）
   第1判定は「時間」: 破棄は発話の区切り（ポーズ）の後に起きるため、
   600ms以上安定していた暫定文が前方一致しない別文に置き換わったら破棄と断定する。
   文字指標（単語の重なり・bigram重なり）は発話中の置き換わりを拾う補助判定。 */
var interimChangedAt=0, lastInterimVal='';   // 暫定文が最後に変化した時刻とその値
function bigrams(s){var m={},i;for(i=0;i<s.length-1;i++){var b=s.substr(i,2);m[b]=(m[b]||0)+1;}return m;}
function dice(a,b){
  var A=bigrams(a),B=bigrams(b),inter=0,ta=0,tb=0,k;
  for(k in A)ta+=A[k];
  for(k in B)tb+=B[k];
  for(k in A)if(B[k])inter+=Math.min(A[k],B[k]);
  if(!ta||!tb)return 0;
  return 2*inter/(ta+tb);
}
/* x の内容が y にどれだけ含まれるか 0..1（EN=単語ベース / JA=文字bigramベース） */
function contained(x,y){
  if(!x||!y)return 0;
  if(lang==='en'){
    var A=x.split(/\s+/).filter(Boolean);
    if(!A.length)return 0;
    var B={},arr=y.split(/\s+/).filter(Boolean),i;
    for(i=0;i<arr.length;i++)B[arr[i]]=(B[arr[i]]||0)+1;
    var hit=0;
    for(i=0;i<A.length;i++){if(B[A[i]]){hit++;B[A[i]]--;}}
    return hit/A.length;
  }
  var bx=bigrams(x),by=bigrams(y),hit=0,tot=0,k;
  for(k in bx){tot+=bx[k];if(by[k])hit+=Math.min(bx[k],by[k]);}
  return tot? hit/tot : 0;
}
function wordJacc(a,b){
  var A=a.split(/\s+/).filter(Boolean), B=b.split(/\s+/).filter(Boolean);
  if(!A.length||!B.length)return 0;
  var S={},T={},k,i,inter=0,uni=0;
  for(i=0;i<A.length;i++)S[A[i]]=1;
  for(i=0;i<B.length;i++)T[B[i]]=1;
  for(k in S){uni++;if(T[k])inter++;}
  for(k in T){if(!S[k])uni++;}
  return inter/uni;
}
function shouldSalvage(prev,next,stableMs){
  var x=norm(prev), y=norm(next);
  if(!x||!y)return false;
  if(x.indexOf(y)===0||y.indexOf(x)===0)return false;   // 前方一致 → 伸長・縮退であり破棄ではない
  if(x.length<6)return false;                            // ごく短い揺れは修正扱い
  if(/^[぀-ヿー、。\s]+$/.test(x) && /[一-鿿]/.test(y) && y.length>=x.length*0.3)
    return false;                                        // 仮名の文→漢字混じり ＝ かな漢字変換
  if(contained(x,y)>=0.6)return false;                   // 新しい暫定が旧の内容をほぼ含む ＝ 書き直し（何も失われない）
  if(stableMs>=600)return true;                          // ポーズ後の置き換わり ＝ 区切り済みの文の破棄
  if(lang==='en'){
    if(x.length<12)return false;
    if(dice(x,y)>=0.55)return false;                     // 文字の重なりが濃い → 全文言い直し
    return wordJacc(x,y)<0.35;                           // 単語がほぼ共通しない → 別の文＝破棄
  }
  if(y.length>=x.length*0.55)return false;               // 日本語: 長さが近い揺れは変換・言い直し
  return dice(x,y)<0.5;
}
/* 破棄されかけた文を確定へ格上げ（エンジンが実際に出力した文字だけ。推測補完はしない） */
function salvage(text){
  commitChunk(text);
  lastGhost=norm(text);
}

/* ---- 音声認識（iOS Safari は無音などで勝手に止まるため自動再開） ---- */
/* v6: Chrome のセッション寿命(約60秒)対策のウォッチドッグ。
   セッションは50秒前後で処理を止めるのに onend が来るまで30秒ほど沈黙するため、
   イベント待ちをやめて能動的に作り直す。
   v13: マイク音量の常時監視を追加（実測: 30〜44秒でセッションが無言死→12秒検知＋数秒の
   再開遅延＝約20秒のフリーズが出ていた）。
   - 音が来ているのに結果が止まった → 4.5秒で死亡判定して即作り直し（従来12秒）
   - セッションが死にやすい28秒以降は、会話の切れ目（無音）を狙って先回りで作り直す
     （再開直後の応答遅延が無音時間に吸収され、発話中の取りこぼしが減る） */
var sessionStartedAt=0, lastResultAt=0, tick=null;
var monStream=null, monCtx=null, monAnalyser=null, monData=null, lastVoiceAt=0, noiseFloor=0.006;
function startMonitor(){
  if(monStream) return;
  try{
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(st){
      monStream=st;
      var AC=window.AudioContext||window.webkitAudioContext;
      monCtx=new AC();
      if(monCtx.state==='suspended'){ try{monCtx.resume();}catch(e){} }
      var srcN=monCtx.createMediaStreamSource(st);
      monAnalyser=monCtx.createAnalyser(); monAnalyser.fftSize=512;
      srcN.connect(monAnalyser);
      monData=new Uint8Array(monAnalyser.fftSize);
      diag('audio monitor on');
    }).catch(function(e){ diag('audio monitor unavailable: '+e.name); });
  }catch(e){ diag('audio monitor error'); }
}
function stopMonitor(){
  try{ if(monStream)monStream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  monStream=null;
  try{ if(monCtx)monCtx.close(); }catch(e){}
  monCtx=null; monAnalyser=null; monData=null;
}
function voiceLevel(){
  if(!monAnalyser||!monData) return -1;
  try{
    monAnalyser.getByteTimeDomainData(monData);
    var s=0;
    for(var i=0;i<monData.length;i++){ var v=(monData[i]-128)/128; s+=v*v; }
    return Math.sqrt(s/monData.length);
  }catch(e){ return -1; }
}
function forceRestart(){
  clearTimeout(restartTimer);
  var old=rec;
  if(old){ try{old.onend=null;old.onresult=null;old.onerror=null;old.abort();}catch(e){} }
  if(interim){ salvage(interim); interim=''; render(); }
  doneLen=0;
  noteSessionOutcome();                          // 結果ゼロのゾンビ死もカウント（英語なら経路を回す）
  try{ startSession(); }catch(e){}
}
function startWatchdog(){
  stopWatchdog();
  lastVoiceAt=0;
  tick=setInterval(function(){
    if(!running)return;
    var now=Date.now();
    var idle=now-lastResultAt;
    var age=now-sessionStartedAt;
    var quiet=(!interim && idle>1500);
    var lvl=voiceLevel();
    if(lvl>=0){
      if(lvl<noiseFloor) noiseFloor=noiseFloor*0.8+lvl*0.2;          // 静かな瞬間に床を追従
      else noiseFloor=Math.min(0.02, noiseFloor*1.002);
      if(lvl>Math.max(0.012, noiseFloor*3)) lastVoiceAt=now;
    }
    var voiceRecent = lastVoiceAt>0 && (now-lastVoiceAt)<2500;
    /* 音が来ているのに結果が止まった＝セッション無言死。ただし開始直後の
       初回応答遅延（実測2〜7秒）を誤検知しないよう、未応答セッションは9秒まで待つ */
    if(voiceRecent && idle>4500 && (sessionHadResult || age>9000)){
      diag('watchdog dead-session (audio active) idle='+(idle/1000).toFixed(1)+'s age='+(age/1000).toFixed(1)+'s');
      forceRestart(); return;
    }
    /* 会話の切れ目での先回りローテーション（死にやすい帯に入る前に作り直す） */
    if(lvl>=0 && age>28000 && !voiceRecent && quiet){
      diag('watchdog proactive-rotate at pause age='+(age/1000).toFixed(1)+'s');
      forceRestart(); return;
    }
    if(idle>12000 || (age>42000 && quiet) || age>55000){
      diag('watchdog idle='+(idle/1000).toFixed(1)+'s age='+(age/1000).toFixed(1)+'s');
      forceRestart();   // 死んだ/寿命間近のセッションを待たずに作り直す
    }
  },1000);
}
function stopWatchdog(){ if(tick){clearInterval(tick);tick=null;} }
var sessionHadResult=false, sessionHadSpeech=false, consecFail=0, abortStreak=0;
/* v11: 英語認識の自動フォールバック。
   一部の Chrome で en-US だけが結果ゼロのまま沈黙する事象が実測されたため
   （同じマイク・同じ瞬間に en-GB / en-AU は正常）、結果ゼロのセッションが続いたら
   地域バリアントを自動で切り替える。成功した経路は localStorage に記憶する。 */
var EN_VARIANTS=['en-US','en-GB','en-AU'];
var enIdx=0; try{ var _s=localStorage.getItem('lt_envar'); var _i=EN_VARIANTS.indexOf(_s); if(_i>=0)enIdx=_i; }catch(e){}
var zeroSessions=0, rotationsThisRun=0;
function rotateEnVariant(reason){
  enIdx=(enIdx+1)%EN_VARIANTS.length; rotationsThisRun++;
  try{ localStorage.setItem('lt_envar', EN_VARIANTS[enIdx]); }catch(e){}
  diag('rotate en -> '+EN_VARIANTS[enIdx]+' ('+reason+')');
  setStatus('英語認識エンジンを '+EN_VARIANTS[enIdx]+' に切替えました');
  consecFail=0; abortStreak=0; zeroSessions=0;
}
/* セッションが「音は流れているのに結果ゼロ」で死んだかを記録し、
   英語なら未試行のバリアントへ回す。回したら true。 */
function noteSessionOutcome(){
  if(!running) return false;
  /* v12: 無音セッションは故障に数えない。音声検知(speechstart)があったのに
     結果ゼロで死んだセッションだけを「ゾンビ」として数える */
  if(!sessionHadResult && sessionHadSpeech && (Date.now()-sessionStartedAt)>4000) zeroSessions++;
  if(lang==='en' && rotationsThisRun<EN_VARIANTS.length-1 && (abortStreak>=3 || zeroSessions>=2)){
    rotateEnVariant(abortStreak>=3?'abort-storm':'zero-results');
    return true;
  }
  return false;
}
function startSession(){
  rec=new SR();
  sessionStartedAt=Date.now(); lastResultAt=Date.now(); sessionHadResult=false; sessionHadSpeech=false;
  rec.lang = (lang==='ja') ? 'ja-JP' : EN_VARIANTS[enIdx];
  rec.continuous=true;
  rec.interimResults=true;
  if(localASR[rec.lang]){try{rec.processLocally=true;}catch(e){}}
  diag('start '+rec.lang+(localASR[rec.lang]?' [local]':' [network]'));
  doneLen=0; lastGhost='';
  rec.onspeechstart=function(){ sessionHadSpeech=true; };
  rec.onresult=function(e){
    lastResultAt=Date.now();
    if(!sessionHadResult){
      sessionHadResult=true; consecFail=0; abortStreak=0; zeroSessions=0;
      diag('first result +'+(Date.now()-sessionStartedAt)+'ms');
      if(lang==='en'){ try{ localStorage.setItem('lt_envar', EN_VARIANTS[enIdx]); }catch(e){} }
    }
    var f='',it='';
    for(var i=0;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal) f+=r[0].transcript; else it+=r[0].transcript;
    }
    if(f.length<doneLen) doneLen=0;              // 稀な finals リセットに追従
    if(f.length>doneLen){
      var chunk=f.slice(doneLen); doneLen=f.length;
      var nc=norm(chunk);
      /* v14: 確定チャンクにも新しい暫定にも引き継がれない旧暫定を、上書き前に温存する。
         一度画面に表示された文が、次の文の確定と同時に黙って消える穴（実測: エンジンが
         結果配列を内部リセットした際、未確定のまま消えた文が確定経路では救済されなかった） */
      if(interim){
        var oi=norm(interim), nit=norm(it||'');
        var carried =
          (nc && (nc.indexOf(oi)>=0 || oi.indexOf(nc)===0 || contained(oi,nc)>=0.6)) ||
          (nit && (nit.indexOf(oi)>=0 || oi.indexOf(nit)===0 || contained(oi,nit)>=0.6));
        if(!carried && oi.length>=6){ salvage(interim); }
      }
      if(lastGhost && nc && (nc===lastGhost || nc.indexOf(lastGhost)===0 || lastGhost.indexOf(nc)===0)){
        lastGhost='';                            // 救済済みの文が後から確定した → 二重追加しない
      }else{
        commitChunk(chunk);
      }
      interim=it;
    }else{
      if(it==='' && interim){
        /* 確定なしで暫定だけ消えた → まだ捨てない（次の確定か onend まで保持） */
      }else if(interim && it && interim!==it){
        var stableMs=interimChangedAt? (Date.now()-interimChangedAt) : 999999;
        if(shouldSalvage(interim,it,stableMs)){
          salvage(interim);                      // 破棄検知 → 温存してから新しい文へ
        }
        interim=it;
      }else{
        interim=it;                              // 通常の伸長・言い直し修正
      }
    }
    if(interim!==lastInterimVal){ lastInterimVal=interim; interimChangedAt=Date.now(); }
    render();
    scheduleInterimTranslation();
  };
  rec.onerror=function(e){
    diag('error '+e.error);
    if(e.error==='aborted' && !sessionHadResult)abortStreak++;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      running=false; refreshUI(); keepAwake(false); stopRecording(); stopMonitor();
      setStatus('マイク/音声認識が許可されていません。設定 > Safari > マイク を確認してください');
    }
  };
  rec.onend=function(){
    diag('end age='+((Date.now()-sessionStartedAt)/1000).toFixed(1)+'s'+(sessionHadResult?'':' (no result)'));
    if(interim){ salvage(interim); interim=''; } // セッション終了時の暫定分も温存
    doneLen=0;
    if(noteSessionOutcome()){                    // 英語バリアントを回した → 新しい経路で即再開
      restartTimer=setTimeout(function(){try{startSession();}catch(e){}},250);
      render(); return;
    }
    if(running && (abortStreak>=3 || zeroSessions>=4)){
      /* 音が届いているのに認識サービスが結果を返さず abort が続く
         ＝ Chrome 内部の音声認識サービスが固まっている（再起動でしか直らない）。
         無限に再試行せず、原因と対処を画面に出して止まる */
      running=false; stopWatchdog(); stopMonitor(); stopRecording(); keepAwake(false); refreshUI();
      diag('abort-storm stop');
      setStatus('ブラウザの音声認識が応答しません。Chrome を完全終了（Mac は Cmd+Q）→再起動してから、もう一度お試しください');
      transInterim=''; render();
      return;
    }
    if(running){
      var delay=120;
      if(!sessionHadResult){                     // 結果ゼロで即死 → サービス拒否の可能性。間隔を空けて再試行
        consecFail++;
        delay=Math.min(8000, 250*Math.pow(2,consecFail));
        diag('backoff '+delay+'ms (fail x'+consecFail+')');
      }
      restartTimer=setTimeout(function(){try{startSession();}catch(e){}},delay);
    }else{
      transInterim='';
      refreshUI();
    }
    render();
  };
  try{rec.start();}catch(e){
    if(running){restartTimer=setTimeout(function(){try{startSession();}catch(e2){}},500);} // 起動失敗を握り潰さず再試行
  }
}

/* ---- 録音（書き出し用。失敗しても文字起こしは継続） ---- */
function startRecording(streamOverride){
  if(!navigator.mediaDevices||!window.MediaRecorder)return;
  /* 無加工マイク: エコーキャンセル/ノイズ抑制/自動ゲインを切る。
     既定の加工が入ると、スピーカー再生音やBGM混じりの声が「ノイズ・エコー」として
     消され、認識エンジンに渡る音まで劣化する（v2で認識が悪化した主因の推定） */
  var rawAudio={echoCancellation:false, noiseSuppression:false, autoGainControl:false};
  (streamOverride ? Promise.resolve(streamOverride)
   : navigator.mediaDevices.getUserMedia({audio:rawAudio}).catch(function(){
       return navigator.mediaDevices.getUserMedia({audio:true});
     })
  ).then(function(s){
    mediaStream=s;
    var mime='';
    if(MediaRecorder.isTypeSupported){
      if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';
      else if(MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
    }
    try{recorder=mime?new MediaRecorder(s,{mimeType:mime}):new MediaRecorder(s);}
    catch(e){recorder=new MediaRecorder(s);}
    audioMime=recorder.mimeType||mime||'audio/mp4';
    diag('recording on ('+audioMime+')');
    audioChunks=[];
    recorder.ondataavailable=function(ev){if(ev.data&&ev.data.size)audioChunks.push(ev.data);};
    recorder.start(1000);
  }).catch(function(){
    setStatus('録音は開始できませんでした（文字起こしは動作します）');
  });
}
function stopRecording(){
  try{if(recorder&&recorder.state!=='inactive')recorder.stop();}catch(e){}
  if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop();});mediaStream=null;}
  recorder=null;
}

/* ---- 書き出し ---- */
function pad(n){return (n<10?'0':'')+n;}
function fmtTs(s){
  if(!(s>0))s=0;
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return pad(h)+':'+pad(m)+':'+(sec<10?'0':'')+sec.toFixed(3);
}
function stamp(){
  var d=new Date();
  return 'transcript-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());
}
function dl(blob,name){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
}
function exportAudio(){
  if(!audioChunks.length){setStatus('録音データがありません');return;}
  var ext = audioMime.indexOf('mp4')>=0 ? 'm4a' : (audioMime.indexOf('webm')>=0?'webm':'audio');
  dl(new Blob(audioChunks,{type:audioMime}), stamp()+'.'+ext);
  setStatus('音声を書き出しました');
}
function exportVtt(kind){ // 'src' | 'tr'
  var list=segs.filter(function(g){return kind==='src'? !!g.src : !!g.tr;});
  if(!list.length){setStatus(kind==='src'?'書き出すテキストがありません':'翻訳データがありません');return;}
  var out='WEBVTT\n\n';
  list.forEach(function(g,i){
    out += (i+1)+'\n'+fmtTs(g.t0)+' --> '+fmtTs(g.t1)+'\n'+(kind==='src'?g.src:g.tr).trim()+'\n\n';
  });
  dl(new Blob([out],{type:'text/vtt'}), stamp()+(kind==='src'?'-src':'-translated')+'.vtt');
  setStatus(kind==='src'?'原文を書き出しました':'翻訳を書き出しました');
}

/* ---- クリップボード ---- */
function copyNow(){
  var t=fullText();
  if(!t){setStatus('コピーする内容がありません');return;}
  var done=function(){setStatus('クリップボードにコピーしました（'+t.length+'文字）');};
  var fb=function(){
    var ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try{document.execCommand('copy');done();}
    catch(e){setStatus('自動コピーに失敗しました。テキストを長押しで選択してください');}
    document.body.removeChild(ta);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,fb);
  }else fb();
}

/* ---- 全選択（Ctrl/Cmd+A）をボックス単位に ---- */
var lastPane=srcTxt;
srcPane.addEventListener('pointerdown',function(){lastPane=srcTxt;});
transPane.addEventListener('pointerdown',function(){lastPane=transTxt;});
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey) && (e.key==='a'||e.key==='A')){
    var target=lastPane;
    var sel=window.getSelection();
    if(sel && sel.anchorNode){
      if(srcTxt.contains(sel.anchorNode)) target=srcTxt;
      else if(transTxt.contains(sel.anchorNode)) target=transTxt;
    }
    if(target===transTxt && transPane.style.display==='none') target=srcTxt;
    e.preventDefault();
    var r=document.createRange();
    r.selectNodeContents(target);
    sel.removeAllRanges();
    sel.addRange(r);
  }
});

/* ---- 画面スリープ防止 ---- */
function keepAwake(on){
  if(!('wakeLock' in navigator))return;
  if(on){
    navigator.wakeLock.request('screen').then(function(w){wl=w;}).catch(function(){});
  }else if(wl){
    wl.release().catch(function(){}); wl=null;
  }
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&running)keepAwake(true);
});

/* ==== v15: ローカルAI認識（Whisper・ブラウザ内推論・API利用料ゼロ） ====
   目的: スピーカー越しのテレカン音声の確実な捕捉。
   - Web Speech と違い、認識に使う音声ストリームをこちらで選べる:
     マイク（AECオフ＝スピーカー再生音が打ち消されない）／タブ・画面共有の音声（デジタル直取り）
   - 連続バッファ＋無音区切りの逐次推論なので、セッション死・再作成の隙間が原理的に無い
   - モデル（whisper-base 約80MB）は初回のみダウンロードされブラウザにキャッシュ。
     推論は端末内（WebGPU、無ければWASM）。外部の認識APIは一切呼ばない＝利用料ゼロ */
var engine='sr';               // 'sr'（Web Speech）| 'wh'（ローカルAI）
try{ if(localStorage.getItem('lt_engine')==='wh') engine='wh'; }catch(e){}
var WH_SR=16000;
var wh={pipe:null, loading:false, dev:'', stream:null, ctx:null, proc:null, gain0:null,
        buf:[], rmsArr:[], bufLen:0, speechMs:0, silenceMs:0, floor:0.006,
        queue:[], busy:false, running:false, srcKind:'mic'};
try{ if(localStorage.getItem('lt_whsrc')==='tab') wh.srcKind='tab'; }catch(e){}
function whDiag(m){ diag('[wh] '+m); }
function whLoadModel(){
  if(wh.pipe) return Promise.resolve(wh.pipe);
  if(wh.loading) return Promise.reject(new Error('loading'));
  wh.loading=true;
  setStatus('ローカルAIモデルを準備中…（初回のみ約80MBをダウンロード。2回目からは即起動）');
  return import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.6/dist/transformers.min.js')
    .then(function(mod){
      var devP = (navigator.gpu && navigator.gpu.requestAdapter)
        ? navigator.gpu.requestAdapter().then(function(a){return a?'webgpu':'wasm';}).catch(function(){return 'wasm';})
        : Promise.resolve('wasm');
      return devP.then(function(dev){
        var opts = dev==='webgpu'
          ? {device:'webgpu', dtype:{encoder_model:'fp32', decoder_model_merged:'q4'}}
          : {device:'wasm', dtype:'q8'};
        opts.progress_callback=function(p){
          if(p && p.status==='progress' && typeof p.progress==='number' && /onnx/.test(p.file||''))
            setStatus('AIモデル取得中 '+Math.round(p.progress)+'%（初回のみ）');
        };
        return mod.pipeline('automatic-speech-recognition','onnx-community/whisper-base',opts)
          .catch(function(e){
            whDiag('primary model failed: '+String(e&&e.message||e).slice(0,80));
            return mod.pipeline('automatic-speech-recognition','Xenova/whisper-base',{device:dev,dtype:'q8'});
          })
          .then(function(pipe){ wh.pipe=pipe; wh.dev=dev; whDiag('model ready ('+dev+')'); return pipe; });
      });
    })
    .then(function(p){ wh.loading=false; return p; },
          function(e){ wh.loading=false; throw e; });
}
function whGetStream(){
  if(window.__whInjectStream) return Promise.resolve(window.__whInjectStream);   // 無音E2E検証用の注入口
  if(wh.srcKind==='tab'){
    return navigator.mediaDevices.getDisplayMedia({video:true,audio:true}).then(function(ds){
      ds.getVideoTracks().forEach(function(t){t.enabled=false;});   // 映像は使わない（stopすると共有ごと終わる環境があるため無効化のみ）
      if(!ds.getAudioTracks().length){
        ds.getTracks().forEach(function(t){t.stop();});
        throw new Error('no-audio-share');
      }
      return ds;
    });
  }
  return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
}
function whResetCollect(){ wh.buf=[]; wh.rmsArr=[]; wh.bufLen=0; wh.speechMs=0; wh.silenceMs=0; }
function whCutSegment(force){
  if(wh.speechMs<400){ whResetCollect(); return; }        // 音声なし区間は推論しない（幻聴防止・省電力）
  var frames=wh.buf, rms=wh.rmsArr, cutIdx=frames.length;
  if(force && frames.length>14){
    /* 15秒強制カット: 末尾3秒でいちばん静かなフレームで切り、残りは次セグメントへ持ち越す */
    var from=frames.length-12, best=from, bv=1e9;
    for(var i=from;i<frames.length;i++){ if(rms[i]<bv){bv=rms[i];best=i;} }
    cutIdx=best;
  }
  var len=0,i;
  for(i=0;i<cutIdx;i++)len+=frames[i].length;
  var seg=new Float32Array(len), off=0;
  for(i=0;i<cutIdx;i++){ seg.set(frames[i],off); off+=frames[i].length; }
  var rest=frames.slice(cutIdx), restRms=rms.slice(cutIdx);
  whResetCollect();
  wh.buf=rest; wh.rmsArr=restRms;
  for(i=0;i<rest.length;i++)wh.bufLen+=rest[i].length;
  wh.queue.push(seg);
  whPump();
}
var WH_HALLU=[/^ご視聴ありがとうございました[。.]?$/,/^ありがとうございました[。.]?$/,
  /^thank you[.!]?$/i,/^thanks for watching[.!]?$/i,/^\[?blank[_ ]?audio\]?$/i,/^[\s.。、,!?！？♪()（）\-]*$/];
function whIsHallu(t){
  var x=t.trim();
  for(var i=0;i<WH_HALLU.length;i++)if(WH_HALLU[i].test(x))return true;
  return false;
}
function whPump(){
  if(wh.busy || !wh.pipe) return;    // モデル準備前はキューに溜める（音は失わない）
  var item=wh.queue.shift();
  if(!item) return;
  wh.busy=true;
  if(wh.queue.length>=1) setStatus('AI認識中…（待ち '+wh.queue.length+'件）');
  var t0=Date.now();
  wh.pipe(item,{language: lang==='ja'?'japanese':'english', task:'transcribe'})
    .then(function(out){
      var txt=((out&&out.text)||'').trim();
      whDiag('seg '+(item.length/WH_SR).toFixed(1)+'s -> '+(Date.now()-t0)+'ms '+txt.length+'ch q='+wh.queue.length);
      if(txt && !whIsHallu(txt)) commitChunk(txt);
      render();
    })
    .catch(function(e){ whDiag('infer error '+String(e&&e.message||e).slice(0,80)); })
    .then(function(){
      wh.busy=false;
      if(wh.queue.length) whPump();
      else if(wh.running) setStatus('聞き取り中…（ローカルAI・'+wh.dev+(wh.srcKind==='tab'?'・タブ音声':'・マイク')+'）');
    });
}
function whStart(){
  /* 順序が重要: getDisplayMedia はクリック直後の user activation が必要なので
     ストリーム取得を先に行い、モデルロードは後追い（ロード中の音声もバッファへ溜まる） */
  whGetStream().then(function(st){
      if(!running){ try{st.getTracks().forEach(function(t){t.stop();});}catch(e){} return; }
      wh.stream=st;
      var AC=window.AudioContext||window.webkitAudioContext;
      wh.ctx=new AC({sampleRate:WH_SR});
      if(wh.ctx.state==='suspended'){ try{wh.ctx.resume();}catch(e){} }
      var srcN=wh.ctx.createMediaStreamSource(st);
      wh.proc=wh.ctx.createScriptProcessor(4096,1,1);
      wh.gain0=wh.ctx.createGain(); wh.gain0.gain.value=0;  // 出力へは無音（エコー・二重再生防止）
      srcN.connect(wh.proc); wh.proc.connect(wh.gain0); wh.gain0.connect(wh.ctx.destination);
      whResetCollect();
      wh.running=true;
      wh.proc.onaudioprocess=function(ev){
        if(!wh.running) return;
        var ch=ev.inputBuffer.getChannelData(0);
        var f32=new Float32Array(ch);
        var s=0; for(var i=0;i<f32.length;i++)s+=f32[i]*f32[i];
        var r=Math.sqrt(s/f32.length);
        wh.buf.push(f32); wh.rmsArr.push(r); wh.bufLen+=f32.length;
        if(r<wh.floor) wh.floor=wh.floor*0.8+r*0.2; else wh.floor=Math.min(0.02, wh.floor*1.001);
        var frameMs=f32.length/WH_SR*1000;
        if(r>Math.max(0.008, wh.floor*3)){ wh.speechMs+=frameMs; wh.silenceMs=0; }
        else wh.silenceMs+=frameMs;
        var durMs=wh.bufLen/WH_SR*1000;
        if(wh.speechMs>=600 && wh.silenceMs>=700 && durMs>=1500) whCutSegment(false);
        else if(durMs>=15000) whCutSegment(true);
        else if(wh.speechMs===0 && durMs>=6000){
          /* 純無音が続く: 直近1フレームだけ残して捨てる（メモリと幻聴の抑制） */
          var last=wh.buf[wh.buf.length-1], lr=wh.rmsArr[wh.rmsArr.length-1];
          wh.buf=[last]; wh.rmsArr=[lr]; wh.bufLen=last.length;
        }
      };
      diag('wh capture on ('+wh.srcKind+')');
      if(wh.pipe) setStatus('聞き取り中…（ローカルAI・'+wh.dev+(wh.srcKind==='tab'?'・タブ音声':'・マイク')+'）');
      else setStatus('音声の取り込みを開始しました（AIモデルを準備中…この間の音声も溜めています）');
      /* タブ音声モード: 録音は同じストリームから取る */
      if(recTgl.checked && wh.srcKind==='tab') startRecording(new MediaStream(st.getAudioTracks()));
      else if(recTgl.checked) startRecording();
      /* モデルは後追いロード（初回のみDL）。準備でき次第、溜まったキューを流す */
      return whLoadModel().then(function(){
        if(wh.running) setStatus('聞き取り中…（ローカルAI・'+wh.dev+(wh.srcKind==='tab'?'・タブ音声':'・マイク')+'）');
        whPump();
      });
  }).catch(function(e){
    var msg=String(e&&e.message||e);
    diag('wh start failed: '+msg.slice(0,80));
    running=false; wh.running=false; keepAwake(false); refreshUI();
    if(msg==='no-audio-share')
      setStatus('音声が共有されませんでした。共有ダイアログで「タブ」を選び「音声も共有」にチェックを入れてください');
    else if(/NotAllowed/i.test(msg))
      setStatus('共有/マイクが許可されませんでした。もう一度「開始」からやり直してください');
    else
      setStatus('ローカルAIの準備に失敗しました（'+msg.slice(0,40)+'）。「標準」エンジンをお使いください');
  });
}
function whStop(){
  wh.running=false;
  /* 停止時点までの残りバッファも最後のセグメントとして認識に回す（取りこぼさない） */
  try{ if(wh.speechMs>=400) whCutSegment(false); }catch(e){}
  try{ if(wh.proc)wh.proc.disconnect(); }catch(e){}
  try{ if(wh.gain0)wh.gain0.disconnect(); }catch(e){}
  try{ if(wh.stream && wh.stream!==window.__whInjectStream) wh.stream.getTracks().forEach(function(t){t.stop();}); }catch(e){}
  try{ if(wh.ctx)wh.ctx.close(); }catch(e){}
  wh.proc=null; wh.gain0=null; wh.stream=null; wh.ctx=null;
  whResetCollect();
}

/* ---- UI ---- */
mainBtn.addEventListener('click',function(){
  if(engine==='sr' && !SR){setStatus('このブラウザは音声認識に未対応です。「ローカルAI」エンジンをお試しください');return;}
  if(running){
    copyNow();                      // 停止タップと同時に全文をコピー
    running=false;
    if(engine==='wh'){
      whStop();
    }else{
      clearTimeout(restartTimer);
      stopWatchdog();
      stopMonitor();
      try{rec&&rec.stop();}catch(e){}
    }
    stopRecording();
    prevDur=elapsedSec(); takeStart=0;
    keepAwake(false);
    refreshUI();
  }else{
    running=true;
    everStarted=true;
    if(segs.length===0)prevDur=0;
    takeStart=Date.now();
    keepAwake(true);
    refreshUI();
    if(engine==='wh'){
      whStart();                    // 準備（モデル・音声ソース）が整い次第、連続認識に入る
      return;
    }
    abortStreak=0; consecFail=0; zeroSessions=0; rotationsThisRun=0;
    setStatus('聞き取り中…');
    sessionStartedAt=Date.now(); lastResultAt=Date.now();
    startWatchdog();
    startMonitor();                 // v13: 音量監視（死んだセッションの即検知・切れ目ローテ用）
    if(recTgl.checked){
      startRecording();             // 注意: 再開すると録音音声は新しいテイクに置き換わる
      setTimeout(startSession,300); // 録音と認識の同時起動の相性対策で認識をわずかに遅らせる
    }else{
      startSession();               // 録音OFF: マイクは認識エンジン専有（最も認識が安定）
    }
  }
});
/* エンジン・音声ソースの切替（停止中のみ） */
var engSR=document.getElementById('engSR'), engWH=document.getElementById('engWH'),
    srcSeg=document.getElementById('srcSeg'),
    srcMic=document.getElementById('srcMic'), srcTab=document.getElementById('srcTab');
function refreshEngineUI(){
  engSR.classList.toggle('on',engine==='sr');
  engWH.classList.toggle('on',engine==='wh');
  srcSeg.style.display = engine==='wh' ? '' : 'none';
  srcMic.classList.toggle('on',wh.srcKind==='mic');
  srcTab.classList.toggle('on',wh.srcKind==='tab');
}
function setEngine(e2){
  if(running){setStatus('停止してからエンジンを切り替えてください');return;}
  engine=e2;
  try{localStorage.setItem('lt_engine',e2);}catch(e){}
  refreshEngineUI();
  setStatus(e2==='wh'
    ? 'ローカルAI: 端末内で認識します（初回のみモデル取得）。テレカンは「タブ音声」推奨'
    : '標準エンジン（ブラウザの音声認識）');
}
engSR.addEventListener('click',function(){setEngine('sr');});
engWH.addEventListener('click',function(){setEngine('wh');});
srcMic.addEventListener('click',function(){
  if(running){setStatus('停止してから切り替えてください');return;}
  wh.srcKind='mic'; try{localStorage.setItem('lt_whsrc','mic');}catch(e){} refreshEngineUI();
});
srcTab.addEventListener('click',function(){
  if(running){setStatus('停止してから切り替えてください');return;}
  wh.srcKind='tab'; try{localStorage.setItem('lt_whsrc','tab');}catch(e){} refreshEngineUI();
  setStatus('タブ音声: 開始時に共有ダイアログが出ます。テレカンのタブを選び「音声も共有」にチェック');
});
refreshEngineUI();
document.getElementById('copyBtn').addEventListener('click',copyNow);
document.getElementById('clearBtn').addEventListener('click',function(){
  committed=interim=transDone=transInterim='';
  doneLen=0; lastGhost=''; segs=[]; audioChunks=[]; prevDur=0; takeStart=running?Date.now():0;
  render(); refreshUI();
  setStatus('消去しました');
});
document.getElementById('expAudio').addEventListener('click',exportAudio);
document.getElementById('expDiag').addEventListener('click',function(){
  var t='live-transcribe '+V+' 診断ログ\n'+diagBuf.join('\n');
  var done=function(){setStatus('診断ログをコピーしました（'+diagBuf.length+'行）');};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){});}
  else{
    var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){}
    document.body.removeChild(ta);
  }
});
document.getElementById('expSrc').addEventListener('click',function(){exportVtt('src');});
document.getElementById('expTr').addEventListener('click',function(){exportVtt('tr');});

function setLang(l){
  if(lang===l)return;
  lang=l;
  jaBtn.classList.toggle('on',l==='ja');
  enBtn.classList.toggle('on',l==='en');
  setStatus(l==='ja'?'入力言語：日本語 → 英語に翻訳':'入力言語：English → 日本語に翻訳');
  if(running){try{rec.stop();}catch(e){}}   // onend が新しい言語で再開する
}
jaBtn.addEventListener('click',function(){setLang('ja');});
enBtn.addEventListener('click',function(){setLang('en');});
transTgl.addEventListener('change',function(){
  transPane.style.display=this.checked?'':'none';
});

/* オンデバイス認識の探索は「ログに記録するだけ」。v7 で自動有効化したところ
   認識が全滅したため、実挙動を検証するまで有効化はしない（localASR は常に false のまま） */
if(SR){
  ['ja-JP','en-US'].forEach(function(lc){
    try{
      if(typeof SR.available==='function'){
        SR.available({langs:[lc],processLocally:true}).then(function(st){
          diag('local '+lc+': '+st+' (not used)');
        }).catch(function(){});
      }else{
        diag('local API none');
      }
    }catch(e){}
  });
}
document.getElementById('ver').textContent=V;
try{window.__diag=diagBuf; window.__ver=V;}catch(e){}   // リモート診断用の読み取り窓
/* 無音E2E検証用フック（スピーカーを一切鳴らさずにローカルAI経路を検証する）
   __whTest(url): 音声ファイルを直接推論して文字列を返す
   __whMakeStream(url): 音声ファイルを内部ストリーム化して注入（開始を押すと本経路で流れる） */
try{
  window.__whTest=function(url){
    return whLoadModel().then(function(){ return fetch(url); })
      .then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){
        var AC=window.AudioContext||window.webkitAudioContext;
        var c=new AC({sampleRate:WH_SR});
        return c.decodeAudioData(ab).then(function(b){
          var d=b.getChannelData(0);
          return wh.pipe(d,{language:'english',task:'transcribe'}).then(function(o){
            try{c.close();}catch(e){}
            return o.text;
          });
        });
      });
  };
  window.__whMakeStream=function(url){
    return fetch(url).then(function(r){return r.arrayBuffer();}).then(function(ab){
      var AC=window.AudioContext||window.webkitAudioContext;
      var c=new AC();
      if(c.state==='suspended'){try{c.resume();}catch(e){}}
      var dest=c.createMediaStreamDestination();
      return c.decodeAudioData(ab).then(function(b){
        var s=c.createBufferSource(); s.buffer=b; s.connect(dest); s.start();
        window.__whInjectStream=dest.stream;
        window.__whInjectCtx=c;
        return 'stream ready dur='+b.duration.toFixed(1)+'s';
      });
    });
  };
}catch(e){}
if(!SR && engine==='sr'){setStatus('このブラウザは標準音声認識に未対応です。「ローカルAI」をお使いください');}
else{setStatus('「開始」を押してください（'+V+'）');}
render();
refreshUI();
})();
</script>
